<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Оплата проезда</title>
<style>
  /* БАЗА */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  body { margin: 0; background: #f0f0f0; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .hidden { display: none !important; }

  /* --- 1. ГЛАВНАЯ СТРАНИЦА (ТОЛЬКО ИНТЕРЬЕР) --- */
  .payment-header { position: relative; height: 160px; background: #0e8cf0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .payment-header::before { content: ""; position: absolute; top: -20px; left: -10%; width: 120%; height: 90px; background: #0972c4; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
  .payment-header::after { content: ""; position: absolute; bottom: -1px; left: -10%; width: 120%; height: 80px; background: #f0f0f0; border-radius: 50% 50% 0 0 / 100% 100% 0 0; z-index: 1; }
  .payment-header-text { position: relative; z-index: 2; color: #fff; font-size: 20px; font-weight: 500; letter-spacing: 1px; margin-top: 20px; }

  .check-content { background: #f0f0f0; min-height: calc(100vh - 160px); padding: 0 20px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .check-qr-logo { width: 70px; height: 70px; background: #fff; border-radius: 16px; margin-top: -35px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; z-index: 10; }
  .check-qr-inner { width: 60px; height: 60px; background: #0e8cf0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -1px; }
  
  .check-route { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px; }
  .check-price { font-size: 44px; font-weight: 700; color: #333; margin: 0 0 15px; letter-spacing: -1px; }
  .check-date { font-size: 15px; color: #666; margin-bottom: 5px; line-height: 1.4; }
  .check-vehicle { font-size: 15px; color: #666; margin-bottom: 30px; }
  
  .btn-pay-main { width: 100%; max-width: 340px; background: linear-gradient(90deg, #00b4db, #0083b0); color: white; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 131, 176, 0.3); transition: transform 0.1s; }
  .btn-pay-main:active { transform: scale(0.98); }

  /* --- 2. ВЫБОР ТРАНСПОРТА --- */
  .selector-screen { min-height: 100vh; background: #f0f0f0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .selector-card { width: 100%; max-width: 440px; background: #fff; border-radius: 24px; padding: 40px 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); text-align: center; border: 1px solid #e0e0e0; }
  .selector-card h2 { margin: 0 0 24px; font-size: 26px; font-weight: 700; color: #333; }
  .selector-card p { margin: 0 0 20px; color: #667; font-size: 16px; }
  .type-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .type-btn { border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px 12px; font-size: 17px; cursor: pointer; background: #f8f9fb; color: #333; font-weight: 600; transition: all 0.2s; }
  .type-btn.active { background: #0288d1; color: #fff; border-color: #0288d1; }
  .route-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .route-btn { border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 8px; font-size: 16px; cursor: pointer; background: #f8f9fb; color: #333; font-weight: 600; transition: all 0.2s; }
  .route-btn:hover { background: #e0e0e0; }

  /* --- 3. ЧЕК (ФОТО РУКИ) --- */
  .ticket-screen { min-height: 100vh; background: #f0f0f0; padding: 24px; display: flex; flex-direction: column; align-items: center; }
  .ticket-card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); text-align: center; border: 1px solid #e0e0e0; }
  .ticket-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 10px; }
  .ticket-price { font-size: 48px; font-weight: 700; color: #333; margin: 0 0 20px; }
  .ticket-info { font-size: 15px; color: #666; margin-bottom: 10px; }
  .ticket-timer { font-size: 14px; color: #666; margin-bottom: 30px; }
  .ticket-timer span { display: block; font-size: 22px; font-weight: 700; color: #0288d1; margin-top: 5px; }
  
  .qr-box { width: 180px; height: 180px; background: #000; margin: 0 auto; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: bold; }
</style>
</head>
<body>

  <!-- ГЛАВНАЯ СТРАНИЦА (ЧИСТЫЙ ИНТЕРЬЕР) -->
  <div id="mainHomePage">
    <header class="payment-header">
      <div class="payment-header-text">— Оплата проезда —</div>
    </header>

    <main class="check-content">
      <div class="check-qr-logo">
        <div class="check-qr-inner">QR</div>
      </div>

      <div class="check-route">Автобус №18</div>
      <div class="check-price">53 ₽</div>
      <div class="check-date" id="homeDate">08.11.2026 11:56</div>
      <div class="check-vehicle">Т/С: <span id="homeVehicle">3506</span></div>
      
      <button class="btn-pay-main" id="startPayBtn">Оплатить</button>
    </main>
  </div>

  <!-- ЭКРАН ВЫБОРА ТРАНСПОРТА -->
  <section id="selectorScreen" class="selector-screen hidden">
    <div class="selector-card">
      <h2>Выберите транспорт</h2>
      <p>Сначала выберите тип, затем маршрут</p>
      <div class="type-buttons">
        <button class="type-btn" data-type="bus">Автобус</button>
        <button class="type-btn" data-type="trolleybus">Троллейбус</button>
      </div>
      <div id="routeButtons" class="route-buttons hidden"></div>
    </div>
  </section>

  <!-- ЧЕК (БЕЗ ЛИШНИХ КНОПОК) -->
  <div id="ticketScreen" class="ticket-screen hidden">
    <div class="ticket-card">
      <div class="ticket-title" id="ticketRouteTitle">Автобус №18</div>
      <div class="ticket-price">53 ₽</div>
      <div class="ticket-info" id="ticketDate">08.11.2026 11:56</div>
      <div class="ticket-info">Т/С: <span id="ticketVehicle">—</span></div>
      
      <div class="ticket-timer">
        С момента оплаты прошло:
        <span id="timer">00:00</span>
      </div>

      <!-- Заглушка под QR-код -->
      <div class="qr-box">QR-КОД</div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  
  // --- 1. СТАРТОВЫЕ ДАННЫЕ ГЛАВНОЙ ---
  document.getElementById('homeDate').textContent = "08.11.2026 11:56";
  document.getElementById('homeVehicle').textContent = "3506";

  document.getElementById('startPayBtn').addEventListener('click', () => {
    document.getElementById('mainHomePage').classList.add('hidden');
    document.getElementById('selectorScreen').classList.remove('hidden');
  });

  // --- 2. ВЫБОР ТРАНСПОРТА ---
  const routeButtons  = document.getElementById('routeButtons');
  const typeButtons   = document.querySelectorAll('.type-btn');
  const transportRoutes = { bus: ['18', '1', '10', '27', '5', '33', '29', '11'], trolleybus: ['3', '6', '4', '10'] };
  const typeLabels = { bus: 'Автобус', trolleybus: 'Троллейбус' };

  typeButtons.forEach(button => {
    button.addEventListener('click', () => {
      typeButtons.forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      const type = button.dataset.type;
      routeButtons.innerHTML = '';
      
      transportRoutes[type].forEach(number => {
        const routeButton = document.createElement('button');
        routeButton.className = 'route-btn';
        routeButton.textContent = typeLabels[type] + ' ' + number;
        
        routeButton.addEventListener('click', () => {
          // Переход на ЧЕК
          document.getElementById('selectorScreen').classList.add('hidden');
          document.getElementById('ticketScreen').classList.remove('hidden');
          
          // Данные для чека (Т/С пустое)
          document.getElementById('ticketRouteTitle').textContent = typeLabels[type] + ' №' + number;
          document.getElementById('ticketDate').textContent = new Date().toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}).replace(',', '');
          document.getElementById('ticketVehicle').textContent = '—';
          
          startTimer();
        });
        routeButtons.appendChild(routeButton);
      });
      routeButtons.classList.remove('hidden');
    });
  });

  // --- 3. ТАЙМЕР ---
  let timerInterval;
  function startTimer() {
    clearInterval(timerInterval);
    const timerElement = document.getElementById('timer');
    let totalSeconds = 0;
    timerElement.textContent = '00:00';
    timerInterval = setInterval(() => {
      totalSeconds++;
      if (totalSeconds >= 20 * 60) { clearInterval(timerInterval); return; }
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      timerElement.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }, 1000);
  }

});
</script>
</body>
</html>
